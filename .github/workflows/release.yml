name: Release Mod

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Empaquetar Mod en ZIP
        run: |
          # Empaquetamos especificamente las carpetas de juego y el descriptor
          zip -r AutoSupply.zip common interface localisation descriptor.mod
          
      - name: Generar archivo AutoSupply.mod (Descriptor externo)
        run: |
          cat <<EOF > AutoSupply.mod
          name="Auto Logistics Upgrade"
          archive="mod/AutoSupply.zip"
          supported_version="1.19.*"
          EOF

      - name: Crear Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Logistics Upgrade - Build ${{ github.run_number }}
          body: |
            Release automática generada a partir del commit: ${{ github.sha }}
            
            **Instalación Rápida:**
            Descarga `AutoSupply.zip` y `AutoSupply.mod` y colócalos *juntos* en tu carpeta de `mod/` de Hearts of Iron IV.
          files: |
            AutoSupply.zip
            AutoSupply.mod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
